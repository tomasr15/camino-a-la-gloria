project_id = "camino-a-la-gloria"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
[edge_runtime]
enabled = true
policy = "per_worker"
[analytics]
enabled = false
# JWT is validated in the handler with Auth getUser, supporting current signing keys.
# health is intentionally public and returns no user data.
[functions.careers]
verify_jwt = false
[functions.health]
verify_jwt = false
