name: Validacion del checkpoint
on:
  push:
    branches: [main, checkpoint-1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run db:test
      - run: node scripts/game-local-setup.mjs
      - run: npm run test:narrative-db
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: demo-public-browser-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Iniciar frontend de prueba
        run: |
          npm run start -- --port 3100 > /tmp/career-next.log 2>&1 &
          node --input-type=module -e 'for(let i=0;i<60;i++){try{const r=await fetch("http://localhost:3100/carrera");if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);'
      - run: npm run test:career-browser
      - run: npm run test:career-resilience
